<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Multi Boost</title>
<meta name="apple-mobile-web-app-title" content="Multi Boost">
<meta name="theme-color" content="#6e4c1e">
<link rel="apple-touch-icon" href="icone-multiboost.png">
<link rel="icon" type="image/png" href="icone-multiboost.png">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #edf0f5; color: #141b2e; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
  main { display: grid; gap: 16px; justify-items: center; padding: 24px; }
  img { width: 96px; height: 96px; border-radius: 22px; }
  a { display: inline-block; padding: 13px 22px; border-radius: 12px; background: #6e4c1e; color: #fff; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<main>
  <img src="icone-multiboost.png" alt="Multi Boost">
  <p id="msg">Ouverture de Multi Boost…</p>
  <a id="go" href="#">Ouvrir Multi Boost</a>
</main>
<script>
  /* ⬇️ COLLEZ ICI L'URL DE VOTRE APPLICATION (celle qui se termine par /exec) ⬇️ */
  var URL_APP = 'https://script.google.com/macros/s/AKfycbywpt_6vpo8QPYh39kyLKEv80PoQGokQmvvircp2yx2lxUwP8kSjOFVyjwfUYlo0pudYQ/exec';

  var ok = /^https:\/\/script\.google\.com\/.+\/exec/.test(URL_APP);
  document.getElementById('go').href = ok ? URL_APP : '#';
  if (ok) location.replace(URL_APP);
  else document.getElementById('msg').textContent = 'Collez l’URL /exec de l’application dans ce fichier (ligne URL_APP).';
</script>
</body>
</html>
